<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b5e3b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>員工打卡</title>
    <link rel="stylesheet" href="./styles.css?v=4" />
  </head>
  <body>
    <div class="app punch-app">
      <header>
        <p class="eyebrow punch-title">員工打卡</p>
        <h1>選擇姓名後打卡</h1>
        <p id="now" class="now-time" aria-live="polite">現在時間 --</p>
      </header>

      <section>
        <h2>員工</h2>
        <div id="names" class="chips"></div>
      </section>

      <section>
        <h2>上班／下班</h2>
        <div class="row">
          <button type="button" class="choice" data-kind="type" data-value="上班">上班</button>
          <button type="button" class="choice" data-kind="type" data-value="下班">下班</button>
        </div>
      </section>

      <section>
        <h2>區域</h2>
        <div class="row">
          <button type="button" class="choice" data-kind="area" data-value="田間">田間</button>
          <button type="button" class="choice" data-kind="area" data-value="工廠">工廠</button>
        </div>
      </section>

      <button type="button" id="submit" class="submit">送出打卡</button>
      <p id="status" class="status punch-status"></p>
    </div>
    <script src="./staff.js?v=4"></script>
    <script src="./punch.js?v=3"></script>
  </body>
</html>
