<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b5e3b" />
    <title>會計補打卡</title>
    <link rel="stylesheet" href="./styles.css?v=32" />
  </head>
  <body class="makeup-page">
    <div class="app app-wide">
      <header>
        <nav class="page-tabs" aria-label="會計功能">
          <a class="page-tab on" href="./makeup.html">補打卡</a>
          <a class="page-tab" href="./records.html">紀錄</a>
          <a class="page-tab" href="./stats.html">統計</a>
        </nav>
        <p class="eyebrow">會計專用</p>
        <h1>會計補打卡</h1>
      </header>

      <section class="panel">
        <h2>查詢</h2>
        <div class="row view-row">
          <button type="button" class="choice" data-makeup-view="day">單一日期</button>
          <button type="button" class="choice on" data-makeup-view="range">起迄區間</button>
        </div>
        <label class="single-date" id="day-label" hidden>日期
          <input id="makeup-date" type="date" lang="en" />
        </label>
        <div id="makeup-range-wrap" class="field-grid">
          <label>起
            <input id="makeup-from" type="date" lang="en" />
          </label>
          <label>迄
            <input id="makeup-to" type="date" lang="en" />
          </label>
        </div>
      </section>

      <section class="panel">
        <h2>員工</h2>
        <p class="hint">點選變深綠＝已選。紅＝沒打卡、橘＝待確認、淺綠＝當天完成。</p>
        <div class="legend" aria-hidden="true">
          <span class="leg need">沒打卡</span>
          <span class="leg pending">待確認</span>
          <span class="leg ok">完成</span>
          <span class="leg picked">已選</span>
        </div>
        <div id="makeup-names" class="chips"></div>
      </section>

      <p id="makeup-status" class="status makeup-status"></p>
      <div id="makeup-links"></div>

      <section class="panel result-panel" id="makeup-input">
        <h2>結果</h2>
        <p class="hint">單一日期：補卡與確認後按送出。起迄區間：點列進該日。家鑫調工預設沒有，需要時再加。</p>
        <div id="incomplete-wrap" hidden></div>
        <div id="roster-wrap"></div>
      </section>

      <div hidden>
        <label class="single-date" id="week-label">該週任一天
          <input id="makeup-week" type="date" />
        </label>
        <p id="week-span"></p>
        <div id="week-grid"></div>
        <section id="day-times">
          <div id="shift-list"></div>
          <button type="button" id="add-shift">再加一筆上下班</button>
        </section>
        <button type="button" id="makeup-submit">送出並存到 Google 雲端</button>
        <button type="button" id="load-existing">帶出已打卡時間</button>
        <button type="button" id="load-pending">重新載入待確認</button>
        <div id="pending-wrap"></div>
        <button type="button" id="confirm-pending">確認並標為已確認</button>
        <div id="existing-wrap"></div>
        <button type="button" id="confirm-pay">確認帶入計薪時間</button>
        <select id="missing-name"></select>
        <div id="missing-wrap"></div>
      </div>

      <details class="setup">
        <summary>進階：連到 Google 雲端</summary>
        <p class="hint">平常不必打開。備份用，第一次再展開。</p>
        <label>Apps Script 網頁應用程式網址
          <input id="scriptUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" />
        </label>
        <button type="button" id="saveUrl" class="add-shift">儲存網址</button>
      </details>
    </div>
    <script src="./staff.js?v=18"></script>
    <script src="./makeup.js?v=45"></script>
  </body>
</html>
