<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>員工出勤統計</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app app-wide">
      <header>
        <nav class="page-tabs" aria-label="會計功能">
          <a class="page-tab" href="./makeup.html">會計補打卡</a>
          <a class="page-tab" href="./records.html">出勤紀錄</a>
          <a class="page-tab on" href="./stats.html">出勤統計</a>
        </nav>
        <p class="eyebrow">會計專用</p>
        <h1>員工出勤統計</h1>
      </header>

      <section class="panel">
        <h2>統計期間</h2>
        <div class="row">
          <button type="button" class="choice on" data-period="day">單一日期</button>
          <button type="button" class="choice" data-period="range">起迄區間</button>
        </div>
        <label id="day-wrap" class="single-date">統計日期
          <input id="day" type="date" />
        </label>
        <div id="range-wrap" class="field-grid" hidden>
          <label>出勤起
            <input id="from" type="date" />
          </label>
          <label>出勤迄
            <input id="to" type="date" />
          </label>
        </div>
      </section>

      <section class="panel">
        <h2>員工姓名（可複選）</h2>
        <div id="names" class="chips"></div>
      </section>

      <button type="button" id="run" class="submit">統計並寫入「員工出勤統計表」</button>
      <p id="status" class="status"></p>
      <p class="hint">只統計「已確認」與會計補打卡。員工自行打卡若仍是待確認，這裡不算。時數以 30 分鐘為單位：分鐘未滿 15 分算整點，滿 15 分算 30 分。連續打到下午會再扣 12:00–13:00 午休（待確認時已選定的午休為準）。</p>
      <div id="result"></div>
      <button type="button" id="export-excel" class="add-shift" hidden>匯出 Excel 下載</button>

      <details class="setup">
        <summary>進階：連到 Google 雲端</summary>
        <p class="hint">平常不必打開。第一次接到 Google 時再展開，與補打卡頁使用同一個 Apps Script 網址。</p>
        <label>Apps Script 網頁應用程式網址
          <input id="scriptUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" />
        </label>
        <button type="button" id="saveUrl">儲存網址</button>
      </details>
    </div>
    <script src="./staff.js?v=14"></script>
    <script src="./stats.js"></script>
  </body>
</html>
